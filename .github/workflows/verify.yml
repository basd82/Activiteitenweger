name: Verify

on:
  push:
    branches:
      - main
      - client-sync-v0.2.0
  pull_request:

permissions:
  contents: read

jobs:
  android-and-common-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make scripts executable
        run: chmod +x gradlew verify-project.sh

      - name: Verify project
        run: ./verify-project.sh

      - name: Common tests
        run: ./gradlew :shared:allTests --stacktrace
